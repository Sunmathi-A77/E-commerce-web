<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Product Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="product-container">
        <center>
        <div class="product-image">
            <img src="image/Screenshot 2025-03-21 134152.png" alt="Shirt">

        </div>
        </center>
        <center>
        <div class="product-details">
            <p class="price">
                <span class="old-price">$99.00</span>
                <span class="new-price">$49.00</span>
            </p>
            <p class="stock">4 in stock</p>
            <p class="description">
                This is an example of unique content you can add before the add to cart button on each single product page.
            </p>
            <button class="buy-button">🛒 Purchase this item</button>
            <button class="info-button">ℹ Special info about this product</button>

            <p class="sku"><strong>SKU:</strong> WCTS001</p>
            <p class="category"><strong>Category:</strong> <a href="#">Mens wear</a></p>
            <p class="tags"><strong>Tag:</strong> <a href="#">Series 9</a></p>
        </div>
    </div>
</center>
<center>
    <div class="newsletter">
        <p><strong>📩 Subscribe</strong> to our newsletter for the latest updates, gossip & special offers.</p>
        <input type="email" placeholder="E-Mail Address">
        <button>Subscribe</button>
    </div>
</center>

</body>
</html>
